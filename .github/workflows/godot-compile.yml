name: Godot Compile

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Godot Compile
    runs-on: seorilabs-x64
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Load Toolchain
        shell: bash
        run: |
          set -euo pipefail
          set -a; . ./build.env; set +a
          {
            echo "GODOT_VERSION=${GODOT_VERSION}"
            echo "GODOT_STATUS=${GODOT_STATUS}"
            echo "PROJECT_DIR=${PROJECT_DIR}"
          } >> "$GITHUB_ENV"

      - name: Install Godot Runtime Dependencies
        shell: bash
        run: |
          set -euo pipefail

          if ldconfig -p 2>/dev/null | grep -q "libfontconfig.so.1"; then
            echo "fontconfig runtime is already available"
            exit 0
          fi

          if ! command -v apt-get >/dev/null 2>&1; then
            echo "libfontconfig.so.1 is missing and apt-get is unavailable" >&2
            exit 1
          fi

          sudo_cmd=""
          if command -v sudo >/dev/null 2>&1; then
            sudo_cmd="sudo"
          fi

          ${sudo_cmd} apt-get update
          ${sudo_cmd} apt-get install -y libfontconfig1 fontconfig

      - name: Ensure Godot
        shell: bash
        run: |
          set -euo pipefail

          if command -v godot >/dev/null 2>&1 && godot --version | grep -q "^${GODOT_VERSION}.${GODOT_STATUS}"; then
            echo "Using preinstalled Godot: $(command -v godot)"
            godot --version
            exit 0
          fi

          # 러너 아키텍처에 따라 자산을 고른다. 이 fallback 이 arm64 로 고정돼 있으면
          # x64 러너에서 실행 불가능한 바이너리를 받는다.
          case "$(uname -m)" in
            aarch64|arm64) godot_arch="arm64" ;;
            x86_64|amd64) godot_arch="x86_64" ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          install_dir="${RUNNER_TEMP}/godot"
          archive="${install_dir}/godot.zip"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.${godot_arch}.zip"

          mkdir -p "${install_dir}" "${HOME}/.local/bin"
          curl -fsSL "${url}" -o "${archive}"
          unzip -q "${archive}" -d "${install_dir}"

          binary="$(find "${install_dir}" -maxdepth 2 -type f -name "Godot_*_linux.${godot_arch}" -print -quit)"
          if [ -z "${binary}" ]; then
            echo "Godot linux.${godot_arch} binary not found in ${archive}" >&2
            exit 1
          fi

          chmod +x "${binary}"
          ln -sf "${binary}" "${HOME}/.local/bin/godot"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/godot" --version

      - name: Compile And Test
        shell: bash
        run: |
          set -euo pipefail

          # Godot 헤드리스는 스크립트 오류가 있어도 종료 코드 0 을 낼 수 있다.
          # 종료 코드와 로그를 함께 검사한다.
          run_godot_check() {
            local label="$1"
            shift
            local log_file="${RUNNER_TEMP}/godot-${label}.log"
            local timeout_seconds="${GODOT_COMMAND_TIMEOUT_SECONDS:-600}"

            timeout --kill-after=10s "${timeout_seconds}s" "$@" 2>&1 | tee "${log_file}"
            local godot_status="${PIPESTATUS[0]}"

            if [ "${godot_status}" -eq 124 ] || [ "${godot_status}" -eq 137 ]; then
              echo "Godot timed out during ${label} after ${timeout_seconds}s." >&2
              exit 1
            fi

            if [ "${godot_status}" -ne 0 ]; then
              exit "${godot_status}"
            fi

            if grep -E "^(SCRIPT ERROR|ERROR):" "${log_file}"; then
              echo "Godot reported errors during ${label}." >&2
              exit 1
            fi
          }

          # 클린 러너에는 .godot/imported 와 전역 스크립트 클래스 캐시가 없다.
          # 임포트를 먼저 돌리지 않으면 class_name 해석이 연쇄로 깨진다.
          run_godot_check import godot --headless --path "$PROJECT_DIR" --import --quit
          run_godot_check compile godot --headless --path "$PROJECT_DIR" --quit

          test_log="${RUNNER_TEMP}/godot-tests.log"
          timeout --kill-after=10s "${GODOT_COMMAND_TIMEOUT_SECONDS:-600}s" \
            godot --headless --path "$PROJECT_DIR" --script res://tests/run_all.gd 2>&1 | tee "${test_log}"
          test_status="${PIPESTATUS[0]}"
          if [ "${test_status}" -ne 0 ]; then
            echo "Test runner exited with ${test_status}." >&2
            exit "${test_status}"
          fi
          if ! grep -q "\[run_all\] ALL GREEN" "${test_log}"; then
            echo "Test suite did not report ALL GREEN." >&2
            exit 1
          fi
          if grep -E "^(SCRIPT ERROR|ERROR):" "${test_log}"; then
            echo "Godot reported errors during tests." >&2
            exit 1
          fi

          # 앱 흐름 스모크: 온보딩 → 결과 → 홈 → 대국 → 결과. 사용자 저장과 분리된 경로를 쓴다.
          smoke_log="${RUNNER_TEMP}/godot-smoke.log"
          timeout --kill-after=10s "${GODOT_COMMAND_TIMEOUT_SECONDS:-600}s" \
            godot --headless --path "$PROJECT_DIR" --script res://tools/smoke_flow.gd \
            -- --progress-path user://smoke/progress.json 2>&1 | tee "${smoke_log}"
          smoke_status="${PIPESTATUS[0]}"
          if [ "${smoke_status}" -ne 0 ]; then
            echo "Smoke flow exited with ${smoke_status}." >&2
            exit "${smoke_status}"
          fi
          if ! grep -q "\[smoke\] ALL GREEN" "${smoke_log}"; then
            echo "Smoke flow did not report ALL GREEN." >&2
            exit 1
          fi
          if grep -E "^(SCRIPT ERROR|ERROR):" "${smoke_log}"; then
            echo "Godot reported errors during the smoke flow." >&2
            exit 1
          fi
