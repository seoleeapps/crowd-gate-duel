name: Godot Compile

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Godot Compile
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Load Toolchain
        shell: bash
        run: |
          set -euo pipefail
          set -a; . ./build.env; set +a
          {
            echo "GODOT_VERSION=${GODOT_VERSION}"
            echo "GODOT_STATUS=${GODOT_STATUS}"
            echo "PROJECT_DIR=${PROJECT_DIR}"
          } >> "$GITHUB_ENV"

      - name: Install Godot Runtime Dependencies
        shell: bash
        run: |
          set -euo pipefail

          if ldconfig -p 2>/dev/null | grep -q "libfontconfig.so.1"; then
            echo "fontconfig runtime is already available"
            exit 0
          fi

          if ! command -v apt-get >/dev/null 2>&1; then
            echo "libfontconfig.so.1 is missing and apt-get is unavailable" >&2
            exit 1
          fi

          sudo_cmd=""
          if command -v sudo >/dev/null 2>&1; then
            sudo_cmd="sudo"
          fi

          ${sudo_cmd} apt-get update
          ${sudo_cmd} apt-get install -y libfontconfig1 fontconfig

      - name: Ensure Godot
        shell: bash
        run: |
          set -euo pipefail

          if command -v godot >/dev/null 2>&1 && godot --version | grep -q "^${GODOT_VERSION}.${GODOT_STATUS}"; then
            echo "Using preinstalled Godot: $(command -v godot)"
            godot --version
            exit 0
          fi

          # 러너 아키텍처에 따라 자산을 고른다. 이 fallback 이 arm64 로 고정돼 있으면
          # x64 러너에서 실행 불가능한 바이너리를 받는다.
          case "$(uname -m)" in
            aarch64|arm64) godot_arch="arm64" ;;
            x86_64|amd64) godot_arch="x86_64" ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          install_dir="${RUNNER_TEMP}/godot"
          archive="${install_dir}/godot.zip"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.${godot_arch}.zip"

          mkdir -p "${install_dir}" "${HOME}/.local/bin"
          curl -fsSL "${url}" -o "${archive}"
          unzip -q "${archive}" -d "${install_dir}"

          binary="$(find "${install_dir}" -maxdepth 2 -type f -name "Godot_*_linux.${godot_arch}" -print -quit)"
          if [ -z "${binary}" ]; then
            echo "Godot linux.${godot_arch} binary not found in ${archive}" >&2
            exit 1
          fi

          chmod +x "${binary}"
          ln -sf "${binary}" "${HOME}/.local/bin/godot"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/godot" --version

      - name: Compile, tests, courses and coordinate input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qa
          scripts/lint.sh 2>&1 | tee build/qa/compile.log
          scripts/test.sh 2>&1 | tee build/qa/tests.log
          scripts/validate_courses.sh --seeds 10000 2>&1 | tee build/qa/courses.log
          scripts/smoke.sh

      - name: Render English and Korean screens
        shell: bash
        run: |
          set -euo pipefail
          for spec in ko:1080x2340 en:1080x1620 ko:1080x2520 en:1620x2160; do
            locale="${spec%%:*}"
            size="${spec#*:}"
            E2E_CAPTURE=1 E2E_LOCALE="$locale" E2E_SIZE="$size" \
              E2E_RUN_ID="$locale-$size" E2E_OUT="$PWD/build/rendered/$locale-$size" \
              xvfb-run -a scripts/smoke.sh
          done

      - name: Keep logs, journeys and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-qa-${{ github.sha }}
          path: |
            build/qa
            build/e2e
            build/rendered
          retention-days: 3
          if-no-files-found: error
