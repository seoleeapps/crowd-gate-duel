name: Build Google Play release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'seoleeapps/crowd-gate-duel' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: google-play-release
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.16.0'
          check-latest: false
          package-manager-cache: false
      - name: Install Android SDK tools and API 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719' # 16.0, JDK 17
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify trusted tag before secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/check_release.py
      - name: Install declared Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          source build.env
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-$GODOT_STATUS/Godot_v$GODOT_VERSION-${GODOT_STATUS}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          ln -s "$RUNNER_TEMP/godot/Godot_v$GODOT_VERSION-${GODOT_STATUS}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-$GODOT_STATUS/Godot_v$GODOT_VERSION-${GODOT_STATUS}_export_templates.tpz" -o "$RUNNER_TEMP/templates.zip"
          unzip -q "$RUNNER_TEMP/templates.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.$GODOT_STATUS"
          cp -R "$RUNNER_TEMP/templates/." "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.$GODOT_STATUS/"
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          printf '#!/usr/bin/env bash\nexec java -jar "%s/bundletool.jar" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/godot/bundletool"
          chmod +x "$RUNNER_TEMP/godot/bundletool"
      - name: Require current development evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern development-evidence.google-play.before-build.json --dir "$RUNNER_TEMP/evidence"
          gh repo clone seorilabs/.github "$RUNNER_TEMP/governance" -- --depth 1
          npm ci --prefix "$RUNNER_TEMP/governance" --ignore-scripts --no-audit
          node "$RUNNER_TEMP/governance/scripts/release/verify-development-evidence.mjs" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" \
            --target google-play --phase before-build \
            --file "$RUNNER_TEMP/evidence/development-evidence.google-play.before-build.json"
      - name: Build with the app upload key
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_ALIAS }}
          GOOGLE_PLAY_UPLOAD_CERTIFICATE_SHA256: ${{ vars.GOOGLE_PLAY_UPLOAD_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          export GOOGLE_PLAY_UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$GOOGLE_PLAY_UPLOAD_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GOOGLE_PLAY_UPLOAD_KEYSTORE_FILE"
          chmod 600 "$GOOGLE_PLAY_UPLOAD_KEYSTORE_FILE"
          scripts/build_release.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: google-play-${{ github.ref_name }}
          path: build/android
          retention-days: 3
